<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sendy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 60px 24px;
    }
    .container {
      max-width: 680px;
      width: 100%;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    p.tagline {
      font-size: 1.15rem;
      color: #444;
      line-height: 1.6;
      margin-bottom: 48px;
    }
    nav {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    nav a {
      font-size: 0.95rem;
      color: #555;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
      padding-bottom: 2px;
      transition: color 0.15s, border-color 0.15s;
    }
    nav a:hover {
      color: #000;
      border-color: #000;
    }
    footer {
      margin-top: auto;
      padding-top: 60px;
      font-size: 0.82rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sendy</h1>
    <p class="tagline">Sendy helps you save and share travel recommendations with friends.</p>
    <nav>
      <a href="signup.html">Sign up</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms &amp; Conditions</a>
    </nav>
  </div>
  <footer>&copy; 2026 Sendy</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Sendy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 48px 24px 60px;
    }
    .top-nav {
      width: 100%;
      max-width: 480px;
      margin-bottom: 36px;
    }
    .top-nav a {
      font-size: 0.9rem;
      color: #555;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
      padding-bottom: 2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .top-nav a:hover {
      color: #000;
      border-color: #000;
    }
    .container {
      max-width: 480px;
      width: 100%;
    }
    .wordmark {
      font-size: 2rem;
      font-weight: 700;
      color: #4F46E5;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 32px;
      color: #111;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label.field-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      color: #111;
    }
    input[type="text"]:focus,
    input[type="tel"]:focus {
      border-color: #4F46E5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
    }
    .checkbox-group input[type="checkbox"] {
      margin-top: 2px;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      accent-color: #4F46E5;
      cursor: pointer;
    }
    .checkbox-group label {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #444;
      cursor: pointer;
    }
    .checkbox-group label a {
      color: #4F46E5;
      text-decoration: underline;
    }
    .checkbox-group label a:hover {
      color: #3730a3;
    }
    .consent-block {
      margin-top: 24px;
      margin-bottom: 8px;
    }
    button[type="submit"] {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 24px;
      background: #4F46E5;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover {
      background: #4338ca;
    }
    .fine-print {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #888;
      line-height: 1.55;
    }
    footer {
      margin-top: auto;
      padding-top: 60px;
      font-size: 0.82rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="index.html">&larr; Back to home</a>
  </div>

  <div class="container">
    <div class="wordmark">Sendy</div>
    <h1>Sign up for Sendy</h1>

    <form action="#" method="post">

      <div class="form-group">
        <label class="field-label" for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full_name" autocomplete="name" required />
      </div>

      <div class="form-group">
        <label class="field-label" for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" autocomplete="tel" required />
      </div>

      <div class="consent-block">
        <div class="checkbox-group">
          <input type="checkbox" id="sms-consent" name="sms_consent" value="yes" />
          <label for="sms-consent">
            I agree to receive text messages from Sendy, including a one-time verification code and trip reminder notifications. Message frequency varies. Msg &amp; data rates may apply. Reply <a href="terms.html">HELP</a> for help, <a href="terms.html">STOP</a> to opt out.
          </label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms-consent" name="terms_consent" value="yes" />
          <label for="terms-consent">
            I have read and agree to the <a href="terms.html">Terms &amp; Conditions</a> and <a href="privacy.html">Privacy Policy</a>.
          </label>
        </div>
      </div>

      <button type="submit">Create Account</button>

    </form>

    <p class="fine-print">
      By creating an account, you consent to receive SMS messages from Sendy. Msg &amp; data rates may apply. Reply STOP to cancel at any time, HELP for assistance.
    </p>
  </div>

  <footer>&copy; 2026 Sendy</footer>
</body>
</html>
